name: Audit live Warwick discovery
on:
  pull_request:
    paths:
      - 'scripts/update.py'
      - '.github/workflows/audit-discovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Enumerate current four-year Warwick publications without AI generation
        run: python scripts/update.py
        env:
          DISCOVERY_ONLY: '1'
      - name: Upload discovery report
        uses: actions/upload-artifact@v4
        with:
          name: warwick-four-year-discovery
          path: data/discovery-report.md
