name: Validate editorial website
on:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/update.py scripts/weekly_email.py scripts/test_content.py
      - run: python scripts/test_content.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check app.js
